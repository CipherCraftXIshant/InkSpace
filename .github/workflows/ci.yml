name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-audit:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run code linter (Oxlint)
        run: npm run lint

      - name: Run vulnerability audit
        run: npm audit --audit-level=high || true

  build:
    name: Build & Verify Bundle
    needs: [lint-and-audit]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend application
        run: npm run build

      - name: Verify build artifacts exist
        run: |
          test -f dist/index.html || { echo "Missing dist/index.html"; exit 1; }
          echo "Build completed successfully. Artifacts verified."

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkspace-dist
          path: client/dist/
          retention-days: 7
